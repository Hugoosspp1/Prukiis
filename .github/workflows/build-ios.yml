name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Create iOS project
        run: npx cap add ios --packagemanager SPM

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Import App Store signing assets when configured
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [[ -z "$IOS_DISTRIBUTION_P12_BASE64" || -z "$IOS_DISTRIBUTION_P12_PASSWORD" || -z "$IOS_APP_STORE_PROFILE_BASE64" || -z "$IOS_TEAM_ID" ]]; then
            echo "IOS_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Apple distribution signing assets are not configured; creating an unsigned archive."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/prukiis-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          PROFILE_DATA="$RUNNER_TEMP/app-store-profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_DATA"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_DATA")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_DATA")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_SIGNING_READY=true" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=$IOS_TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive app
        run: |
          if [[ "$IOS_SIGNING_READY" == "true" ]]; then
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Prukiis.xcarchive" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY='Apple Distribution' \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
              archive
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Prukiis.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              archive
          fi

      - name: Export signed IPA
        if: env.IOS_SIGNING_READY == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict><key>com.prukiis.arcade</key><string>${IOS_PROFILE_NAME}</string></dict>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Prukiis.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA
        if: env.IOS_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prukiis-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned archive
        if: env.IOS_SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prukiis-ios-unsigned-archive
          path: ${{ runner.temp }}/Prukiis.xcarchive
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing keychain
        if: always() && env.IOS_KEYCHAIN_PATH != ''
        run: security delete-keychain "$IOS_KEYCHAIN_PATH"
